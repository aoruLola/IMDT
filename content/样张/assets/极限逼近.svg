<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
  <title id="title">函数极限的逼近示意图</title>
  <desc id="desc">点 x 沿着曲线逐渐接近 a，函数值逐渐接近 L。</desc>
  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #2b2b2b; }
    .axis { stroke: #555; stroke-width: 2; }
    .curve { fill: none; stroke: #b33a3a; stroke-width: 4; stroke-linecap: round; }
    .guide { stroke: #6a8499; stroke-width: 2; stroke-dasharray: 7 7; }
    .point { fill: #b33a3a; stroke: white; stroke-width: 3; }
    .limit { fill: #2d6a8a; font-size: 22px; font-weight: 700; }
    .caption { font-size: 18px; }
  </style>
  <rect width="720" height="390" rx="18" fill="#fbf8f0"/>
  <line class="axis" x1="70" y1="310" x2="660" y2="310"/>
  <line class="axis" x1="70" y1="340" x2="70" y2="45"/>
  <polygon points="660,310 646,303 646,317" fill="#555"/>
  <polygon points="70,45 63,59 77,59" fill="#555"/>
  <path class="curve" d="M95 270 C165 245 185 165 255 185 S365 245 430 135 S545 100 625 78"/>
  <line class="guide" x1="430" y1="310" x2="430" y2="135"/>
  <line class="guide" x1="70" y1="135" x2="430" y2="135"/>
  <circle cx="430" cy="135" r="7" fill="#2d6a8a"/>
  <circle class="point" cx="220" cy="180" r="10">
    <!-- 直接控制圆心坐标，避免 animateMotion 在不同渲染器中的坐标系差异。 -->
    <animate attributeName="cx" dur="3.2s" repeatCount="indefinite" values="220;280;335;385;430"/>
    <animate attributeName="cy" dur="3.2s" repeatCount="indefinite" values="180;178;160;146;135"/>
  </circle>
  <text class="limit" x="445" y="128">L</text>
  <text class="limit" x="424" y="337">a</text>
  <text class="caption" x="585" y="337">x</text>
  <text class="caption" x="38" y="62">y</text>
  <text class="caption" x="455" y="175">f(x) → L</text>
  <text class="caption" x="190" y="365">当 x → a 时，函数值 f(x) → L</text>
</svg>
