<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">连续点与可去间断点对比</title>
  <desc id="desc">左图曲线在 x 等于 a 处连续，右图曲线在 x 等于 a 处有一个空心点，表示可去间断。</desc>
  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #2b2b2b; }
    .axis { stroke: #666; stroke-width: 2; }
    .curve { fill: none; stroke: #b33a3a; stroke-width: 4; }
    .solid { fill: #b33a3a; stroke: white; stroke-width: 3; }
    .hollow { fill: #fbf8f0; stroke: #2d6a8a; stroke-width: 4; }
    .title { font-size: 22px; font-weight: 700; }
    .caption { font-size: 17px; }
  </style>
  <rect width="760" height="330" rx="18" fill="#fbf8f0"/>
  <g transform="translate(30,35)">
    <text class="title" x="135" y="0">连续</text>
    <line class="axis" x1="25" y1="245" x2="320" y2="245"/>
    <line class="axis" x1="65" y1="275" x2="65" y2="30"/>
    <path class="curve" d="M70 210 C125 190 145 130 185 128 S245 70 300 55"/>
    <circle class="solid" cx="185" cy="128" r="9"/>
    <text class="caption" x="178" y="270">a</text>
    <text class="caption" x="88" y="305">lim f(x) = f(a)</text>
  </g>
  <g transform="translate(400,35)">
    <text class="title" x="105" y="0">可去间断</text>
    <line class="axis" x1="25" y1="245" x2="320" y2="245"/>
    <line class="axis" x1="65" y1="275" x2="65" y2="30"/>
    <path class="curve" d="M70 210 C125 190 145 130 185 128 S245 70 300 55"/>
    <circle class="hollow" cx="185" cy="128" r="9"/>
    <circle class="solid" cx="185" cy="175" r="9"/>
    <text class="caption" x="178" y="270">a</text>
    <text class="caption" x="68" y="305">极限存在，但 f(a) ≠ 极限</text>
  </g>
</svg>
